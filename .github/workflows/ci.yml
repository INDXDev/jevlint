name: CI
on:
  push: { branches: [main] }
  pull_request:
permissions:
  contents: read
concurrency:
  # A new push to a pull request replaces its running check. Each commit on main keeps its own.
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version-file: .node-version, cache: pnpm }
      - id: install
        run: pnpm install --frozen-lockfile
      # The steps of `pnpm check`, apart so that one push shows every failure, each under its name.
      # Failures appear on the pull request's diff: setup-node does this for tsc, and vitest by itself.
      - name: Lint
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm lint --reporter=github
      - name: Typecheck
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm typecheck
      - name: Test
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm test
      - name: Build
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm build
