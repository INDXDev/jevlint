  - { id: cli, label: jevlint CLI, kind: component, component: cli }
  - { id: commands, label: Commands, kind: component, component: commands }
  - { id: library, label: Library API, kind: component, component: library-api }
  - { id: repo-access, label: Repository access, kind: component, component: repository-access }
  - { id: repository, label: Audited repository, kind: store }
  - { id: user-config, label: User config and keys, kind: store, component: configuration }
  - { id: cache, label: Decision cache, kind: store, component: decision-cache }
  - { id: provider, label: Decision model provider, kind: external, packages: ["ai", "@ai-sdk/*"] }
  - { id: git, label: git and gh, kind: external, packages: ["node:child_process"] }
  - { id: github, label: GitHub, kind: external }
  - { id: bucket, label: S3-compatible bucket, kind: external }
  - { id: agent, label: Coding agent CLI, kind: external }
