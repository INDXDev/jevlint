id: architecture-pipeline
title: Architecture pipeline
summary: >
  Runs each architecture verb: collects facts from the code, reviews the structure and the SSOT,
  checks the code against it, finds drift, and computes a refactoring plan.
layer: pipeline
paths:
  [
    "src/architecture/collect.ts",
    "src/architecture/review.ts",
    "src/architecture/check.ts",
    "src/architecture/drift.ts",
    "src/architecture/compile.ts",
    "src/architecture/plan.ts",
    "src/architecture/show.ts",
  ]
key_files:
  - { path: src/architecture/collect.ts, role: "reads files or a commit into outlines and facts" }
  - { path: src/architecture/check.ts, role: "structural rules, checklists, --diff and --new" }
  - { path: src/architecture/review.ts, role: "the review and its perspectives" }
interface: [collect, checkArchitecture, reviewArchitecture, driftArchitecture, prepareCompile]
depends_on:
  [
    audit,
    spec-pipeline,
    architecture-engines,
    ast,
    decision,
    scoring,
    config,
    cache,
    git,
    ssot-loading,
    contracts,
  ]
uses: [ast_grep]
