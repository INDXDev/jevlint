id: agents
title: Coding agents
summary: >
  Starts a coding agent with a prompt on stdin and no shell, runs the project's fixers after a quick
  fix, and re-scores what changed.
layer: interface
paths: ["src/agent.ts"]
key_files:
  - { path: src/agent.ts, role: "launchAgent, runAgent and the quick fix loop" }
interface: [launchAgent, runAgent, agentFailure]
depends_on: [output, audit, config, git, contracts]
