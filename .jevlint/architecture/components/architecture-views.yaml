id: architecture-views
title: Architecture views
summary: >
  Renders architecture reports, the SSOT as ARCHITECTURE.md with Mermaid, an offline HTML page,
  and the prompts that hand architecture work to an agent.
layer: interface
paths:
  [
    "src/architecture/terminal.ts",
    "src/architecture/html.ts",
    "src/architecture/markdown.ts",
    "src/architecture/prompt.ts",
  ]
key_files:
  - { path: src/architecture/markdown.ts, role: "ARCHITECTURE.md and Mermaid diagrams" }
  - { path: src/architecture/prompt.ts, role: "compile, drift, check, review and plan prompts" }
  - { path: src/architecture/html.ts, role: "the review report and the show page" }
interface: [renderMarkdown, renderCompilePrompt, renderShowHtml, formatArchitecture]
depends_on: [output, architecture-pipeline, architecture-engines, ssot-loading, contracts]
