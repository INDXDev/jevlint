id: config
title: Configuration
summary: >
  Loads layered config and presets, keeps repository config away from user-only keys, discovers
  files, reads keys, and parses jevlint-score comments.
layer: infrastructure
paths:
  [
    "src/config.ts",
    "src/credentials.ts",
    "src/presets.ts",
    "src/files.ts",
    "src/directives.ts",
    "src/node-version.ts",
  ]
key_files:
  - { path: src/config.ts, role: "schema, layers, USER_ONLY_KEYS and writeFileAtomic" }
  - { path: src/files.ts, role: "file discovery and exclusions" }
  - { path: src/presets.ts, role: "loads and validates presets" }
interface: [loadConfig, UserError, writeFileAtomic, discoverFiles, loadPresets]
depends_on: [contracts]
