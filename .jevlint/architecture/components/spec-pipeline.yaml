id: spec-pipeline
title: Spec pipeline
summary: >
  Judges code files and documents against the team's checklist spec, two requests each.
layer: pipeline
paths: ["src/spec/check.ts", "src/spec/drift.ts", "src/spec/run.ts"]
key_files:
  - {
      path: src/spec/run.ts,
      role: "the model, the per-path loop and verdicts, shared with architecture",
    }
  - { path: src/spec/check.ts, role: "spec check" }
interface: [startRun, ask, verdicts, checkSpec, driftSpec]
depends_on: [audit, spec-questions, decision, scoring, config, ssot-loading, contracts]
