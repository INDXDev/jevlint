id: scoring
title: Scoring and pins
summary: >
  Pure functions from docs/scoring.md that turn AST findings and raw answers into file and repository
  scores and a refactor-first priority, plus the parser of `jevlint-score` pins, which it strips
  before a model sees the code.
layer: engines
paths: [src/scoring.ts, src/directives.ts]
key_files:
  - { path: src/scoring.ts, role: "fileScore, modelResult, rank, repoScore" }
  - { path: src/directives.ts, role: "parseDirectives for jevlint-score comments" }
interface:
  [
    fileScore,
    modelResult,
    rank,
    repoScore,
    scaleScore,
    astScoreFrom,
    WEAK_COMPLIANCE,
    parseDirectives,
  ]
depends_on: [configuration, contracts]
uses: []
rules:
  - { id: pure, kind: forbid, packages: ["node:*"] }
checklist: []
status: current
