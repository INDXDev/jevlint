id: fixtures
title: Question fixtures
summary: jevlint test in src/fixtures.ts asks each good-* and bad-* fixture under .jevlint/fixtures/ its one preset question, records the answers in .jevlint/calibration.json, and reports fixtures that moved after a model update.
checklist:
  - id: layout
    text: "Fixtures live in .jevlint/fixtures/<full question id>/ and are named good-*.<ext> or bad-*.<ext>, and anything else there is ignored."
    source: docs/presets.md#testing-a-question
  - id: thresholds
    text: "A good fixture passes at compliance 0.7 or more, and a bad fixture passes below 0.7."
    source: docs/cli.md#jevlint-test-questions
  - id: own-question
    text: "Each fixture is sent with only its own question."
    source: docs/cli.md#jevlint-test-questions
  - id: active-only
    text: "Named question ids must be active and have fixtures, and fixture directories naming no active question get a warning."
    source: docs/cli.md#jevlint-test-questions
  - id: record
    text: "--record writes every fixture's provider, model and compliance to .jevlint/calibration.json with no timestamps, and takes no question ids or --preset."
    source: docs/presets.md#testing-a-question
  - id: fresh-answers
    text: "--record and --drift ask afresh and store nothing in the cache, while a plain run uses the cache."
    source: docs/cli.md#jevlint-test-questions
  - id: drift-limit
    text: "--drift lists fixtures whose compliance moved by --drift-limit or more, default 0.1."
    source: docs/cli.md#jevlint-test-questions
  - id: other-model
    text: "When the record is from another provider or model, --drift says so on stderr and compares anyway."
    source: docs/cli.md#jevlint-test-questions
  - id: unrecorded
    text: "A fixture with no record gets a warning and is not compared."
    source: docs/cli.md#jevlint-test-questions
  - id: exit-codes
    text: "test exits 1 if a fixture failed or moved, and 2 with no key or when a request fails, without writing a record."
    source: docs/cli.md#jevlint-test-questions
  - id: symlinks
    text: "test refuses a fixture, fixture directory, .jevlint or record that links outside the repository."
    source: docs/security.md#untrusted-repositories
  - id: record-validated
    text: "The calibration record is validated before use."
    source: docs/security.md#untrusted-repositories
  - id: json-results
    text: "test --json results hold question, file, expected, compliance and passed, sorted by question then file, plus recorded and moved with --drift."
    source: docs/json-output.md#fixture-results
