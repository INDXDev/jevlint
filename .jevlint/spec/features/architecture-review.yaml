id: architecture-review
title: "Architecture review"
summary: "Architecture reviews and the architecture SSOT, as docs/architecture-review.md and docs/architecture-reference.md describe: jevlint architecture builds module, directory and class graphs from imports, reports cycles and size limits, asks the model about the codebase, its directories, its classes and the SSOT, and compiles, shows, checks and keeps current the SSOT in .jevlint/architecture/. Code in src/architecture/."
checklist:
  - id: no-cycles
    text: "dependency-cycle and directory-cycle findings allow no cycle at all."
    source: docs/architecture-review.md#what-it-finds
  - id: subfolder-not-cycle
    text: "A folder and its own subfolder never count as a directory cycle."
    source: docs/architecture-review.md#what-it-finds
  - id: structure-score
    text: "A unit's structure score is set by its worst finding, as limit divided by value, so a cycle of two scores 0.5."
    source: docs/architecture-review.md#scores
  - id: outlines-not-code
    text: "A unit's outline holds paths, line counts, names and dependencies, and never file contents."
    source: docs/architecture-review.md#how-it-works
  - id: one-request-per-unit
    text: "Each unit is one request through decideFile, so a review costs 1 + directories + classes with methods."
    source: docs/architecture-review.md#how-it-works
  - id: methodless-classes
    text: "A class without methods is left out of the ranking unless it has a finding."
    source: docs/architecture-review.md#scores
  - id: line-weighted
    text: "Each perspective's score and the overall score are means weighted by lines."
    source: docs/architecture-review.md#scores
  - id: presets
    text: "The codebase, directory and class perspectives use the architecture-codebase, architecture-directory and architecture-class presets."
    source: docs/architecture-review.md#changing-the-questions
  - id: html-offline
    text: "The HTML report has no scripts and makes no network requests, and --html requires a file name."
    source: docs/architecture-review.md#reading-the-report
  - id: ambiguous-class
    text: "A class name declared in two files links to nothing."
    source: docs/architecture-review.md#language-support
  - id: go-package
    text: "A Go package maps to its first non-test .go file."
    source: docs/architecture-review.md#language-support
  - id: ts-aliases
    text: "TypeScript imports resolve through the root tsconfig.json's paths and through pnpm, npm and bun workspace packages, and an import that resolves to no file is kept as an external package."
    source: docs/architecture-review.md#language-support
  - id: destructuring
    text: "Top-level destructuring patterns are not listed as names."
    source: docs/architecture-review.md#language-support
  - id: not-architecture
    text: "Pins do not apply in jevlint architecture."
    source: docs/architecture-review.md#scores
  - id: limit-rules
    text: "fan-out, hub, directory-files, class-methods, class-lines and inheritance-depth findings are measured against max_fan_out, max_hub_links, max_directory_files, max_class_methods, max_class_lines and max_inheritance_depth."
    source: docs/architecture-review.md#what-it-finds
  - id: score-scope
    text: "A directory counts its own findings, a class counts findings about that class, and the codebase counts every finding."
    source: docs/architecture-review.md#scores
  - id: score-blend
    text: "A unit's structure score blends with the model's answers using ast_weight and model_weight."
    source: docs/architecture-review.md#scores
  - id: excluded-not-in-graph
    text: "Files in exclude, and files jevlint cannot read, are left out of the graph."
    source: docs/architecture-review.md#language-support
  - id: go-methods
    text: "Go methods merge with their type only within one file."
    source: docs/architecture-review.md#language-support
  - id: export-import
    text: "TypeScript export import b = require('./b') is not read as an import."
    source: docs/architecture-review.md#language-support
  - id: perspective-flag
    text: "--perspective takes codebase, directory, class, component or design, comma-separated, reviews only those, and rejects any other name; component and design need an SSOT."
    source: docs/architecture-review.md#how-it-works
  - id: unchanged-without-ssot
    text: "Without an architecture SSOT, jevlint architecture reviews only the codebase, directory and class perspectives, as it did before the SSOT existed."
    source: docs/architecture-review.md
  - id: default-review
    text: "jevlint architecture followed by anything that is not a subcommand runs jevlint architecture review."
    source: docs/cli.md#jevlint-architecture
  - id: ssot-validated
    text: "The architecture SSOT is validated with zod and cross-checked, and holds only globs, package names, ast-grep patterns and prose, never a command, URL or path outside the root."
    source: docs/architecture-reference.md#validation
  - id: structural-rules-static
    text: "Every structural rule of the SSOT is decided from the AST and the import graph, with no model, and every violation has a file and a line."
    source: docs/architecture-reference.md#rules
  - id: compile-no-contents
    text: "The compile prompt holds paths, line numbers and names, never file contents, and jevlint never writes the SSOT itself."
    source: docs/architecture-reference.md#compile
  - id: show-offline
    text: "jevlint architecture show works with no SSOT and no network, and its HTML has no scripts; Mermaid appears only in --markdown output."
    source: docs/cli.md#show
  - id: diff-added-only
    text: "check --diff, pr --architecture and commits --architecture report only the violations a change added, matched without line numbers."
    source: docs/architecture-reference.md#check
  - id: target-status
    text: "Violations in a component with status target are listed apart and do not affect the exit code."
    source: docs/architecture-reference.md#check
  - id: plan-cuts-cheapest
    text: "For a component cycle, plan's move cuts the edge in the cycle with the fewest imports."
    source: docs/architecture-reference.md#plan
