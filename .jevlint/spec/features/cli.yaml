id: cli
title: Command line
summary: The entry point in src/cli.ts that declares the command table, makes audit the default command, maps errors to exit codes and refuses an unpatched Node.js.
checklist:
  - id: default-audit
    text: "Running jevlint with no command runs jevlint audit, and jevlint src runs jevlint audit src."
    source: docs/cli.md
  - id: command-name-wins
    text: "A command's name takes precedence over a directory with the same name."
    source: docs/cli.md
  - id: exit-one
    text: "Exit code 1 means a check failed: a score below fail_under, something new in audit --new, a worse staged change in hook --staged, a failed or moved fixture in test, a violated or unimplemented spec item, or spec drift."
    source: docs/cli.md#exit-codes
  - id: exit-two
    text: "Exit code 2 means a usage or config error, a rejected API key, a refused cache bucket, or a Node.js without the required security fixes."
    source: docs/cli.md#exit-codes
  - id: gate-failures-exit-two
    text: "With fail_under or --new set, a run where no file was scored, every provider request failed, or an environment key was never allowed exits with code 2."
    source: docs/cli.md#exit-codes
  - id: user-error-no-stack
    text: "A UserError prints its message without a stack trace and exits with code 2."
    source: docs/code-reference.md#usererror
  - id: debug-stack
    text: "With DEBUG set to any value, an unexpected error prints its stack trace."
    source: docs/configuration.md#environment-variables
  - id: node-floor
    text: "jevlint refuses to run on a Node.js older than 24.22.1, or 22.23.4 and 26.12.1 on those lines, and on end-of-life lines."
    source: docs/getting-started.md#install
  - id: colour-env
    text: "Colour follows the NO_COLOR and FORCE_COLOR environment variables."
    source: docs/cli.md
  - id: version-flag
    text: "jevlint --version prints the version, and every command supports --help."
    source: docs/cli.md
