id: baseline
title: Baseline
summary: Records today's findings and weak answers in .jevlint/baseline.json with jevlint baseline, in src/baseline.ts, and narrows audit --new to what is new or worse than that record.
checklist:
  - id: contents
    text: "The baseline holds each file's AST findings as rule, symbol and value, and weak answers as id and compliance, sorted and with no timestamps."
    source: docs/cli.md#jevlint-baseline-paths
  - id: replaced
    text: "Running baseline replaces the file rather than merging into it."
    source: docs/cli.md#jevlint-baseline-paths
  - id: match-rule-symbol
    text: "A finding matches the baseline by rule and symbol, not line, and counts as new only if its value got worse."
    source: docs/cli.md#jevlint-baseline-paths
  - id: weak-answer-new
    text: "A weak answer counts as new if the baseline has none for that question or has a higher one."
    source: docs/cli.md#jevlint-baseline-paths
  - id: renamed-new
    text: "A renamed file counts as new."
    source: docs/cli.md#jevlint-baseline-paths
  - id: pinned-settled
    text: "A pinned file counts as settled."
    source: docs/cli.md#jevlint-baseline-paths
  - id: new-exit
    text: "audit --new exits 1 if anything is new or worse, and also applies fail_under when it is set."
    source: docs/cli.md#jevlint-baseline-paths
  - id: no-baseline-error
    text: "--new with no baseline is an error, and so is a baseline run where every provider request failed."
    source: docs/cli.md#jevlint-baseline-paths
  - id: new-json
    text: "audit --new --json keeps only files with something new, and only the new findings and answers in them, while scores, skipped and usage still describe the whole run."
    source: docs/json-output.md#new-issues
  - id: validated
    text: ".jevlint/baseline.json is validated before use."
    source: docs/security.md#untrusted-repositories
  - id: symlink-outside
    text: "A symlink to the baseline, or from .jevlint, that leads outside the repository is an error for reading and for writing."
    source: docs/security.md#untrusted-repositories
