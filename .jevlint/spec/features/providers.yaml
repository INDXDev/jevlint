id: providers
title: "Providers and API keys"
summary: "The decision model providers jevlint calls, as docs/providers.md describes: typesafe, openai, gateway, cloudflare, microsoft and compatible, their default models, key variables, fallback, prices and request limits, and storing keys with jevlint auth. Code in src/decision/ and src/credentials.ts."
checklist:
  - id: default-models
    text: "Default models are jev-latest for typesafe, gpt-6-luna for openai, typesafe-ai/jev for gateway and clef for cloudflare, and microsoft and compatible have none."
    source: docs/providers.md
  - id: key-variables
    text: "Key variables are TYPESAFE_AI_API_KEY, OPENAI_API_KEY, AI_GATEWAY_API_KEY, CLOUDFLARE_API_TOKEN, AZURE_API_KEY and JEVLINT_API_KEY."
    source: docs/providers.md
  - id: base-url-required
    text: "microsoft and compatible require base_url."
    source: docs/providers.md
  - id: fallback-order
    text: "With no key for the configured provider, the first of typesafe, openai, gateway and cloudflare that has a key is used with its default model, and the choice is printed."
    source: docs/providers.md#fallback
  - id: no-fallback-base-url
    text: "microsoft and compatible are never a fallback."
    source: docs/providers.md#fallback
  - id: cloudflare-account
    text: "cloudflare needs an account ID from provider.account_id or CLOUDFLARE_ACCOUNT_ID."
    source: docs/providers.md#cloudflare-workers-ai
  - id: cloudflare-64
    text: "For cloudflare, more than 64 questions are split over several requests."
    source: docs/providers.md#cloudflare-workers-ai
  - id: systemone
    text: "A Jev-compatible endpoint is called with POST <base_url>/systemone."
    source: docs/providers.md#jev-compatible-endpoints
  - id: failure-keeps-ast
    text: "When a model refuses a question or a request fails, the file keeps its AST score and gets a warning."
    source: docs/providers.md#provider-differences
  - id: retry-429
    text: "A 429 response is retried with backoff."
    source: docs/providers.md#provider-differences
  - id: prices
    text: "Built-in input prices are 0.042 USD per million tokens for jev models on typesafe and gateway, 0.10 for gpt-6-luna on openai, and 0.24 for any model on cloudflare."
    source: docs/providers.md#cost-estimates
  - id: unknown-price
    text: "estimateCostUsd returns null when the model's price is unknown, including on microsoft and compatible."
    source: docs/code-reference.md#engines
  - id: chars-per-token
    text: "Token estimates assume 4 characters per token, and bill the file once plus every active question."
    source: docs/providers.md#cost-estimates
  - id: cost-excludes
    text: "Pinned, blank and cached files are not counted in a run's cost."
    source: docs/providers.md#cost-estimates
  - id: credentials-file
    text: "Keys are stored in ~/.config/jevlint/credentials.toml, created with mode 0600."
    source: docs/security.md#api-keys
  - id: env-off-by-default
    text: "A provider's environment variable is ignored until environment keys are allowed."
    source: docs/providers.md#storing-keys
  - id: env-priority
    text: "Once allowed, an environment variable takes priority over the credentials file."
    source: docs/providers.md#storing-keys
  - id: first-run-question
    text: "The first interactive run of a command that uses a key asks whether to allow environment keys, and remembers the answer."
    source: docs/providers.md#storing-keys
  - id: no-terminal-no-question
    text: "With no terminal, nothing asks, and an audit with fail_under set stops with exit code 2 instead of gating on AST scores alone."
    source: docs/providers.md#storing-keys
  - id: auth-env
    text: "auth env on and auth env off allow or refuse keys from environment variables."
    source: docs/cli.md#jevlint-auth
  - id: auth-set-input
    text: "auth set hides typed input, and reads the key from stdin when it is piped."
    source: docs/providers.md#storing-keys
  - id: auth-list-source
    text: "auth list shows each provider and where its key comes from, without printing the key."
    source: docs/cli.md#jevlint-auth
  - id: cloudflare-billing
    text: "Each split cloudflare request bills the file again, and --dry-run counts every request."
    source: docs/providers.md#cloudflare-workers-ai
  - id: run-cost
    text: "audit and architecture show the cost of the input tokens a run used, and output tokens cost nothing."
    source: docs/providers.md#cost-estimates
  - id: auth-remove
    text: "auth remove deletes a provider's stored key."
    source: docs/providers.md#storing-keys
  - id: no-api-key
    text: "An api_key field in jevlint.toml or config.toml is rejected."
    source: docs/providers.md#storing-keys
