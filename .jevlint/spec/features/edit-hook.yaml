id: edit-hook
title: Edit and commit hook
summary: jevlint hook in src/hook.ts reports what a coding agent's edit or a staged commit made worse than HEAD, AST-only by default, and init --pre-commit installs the git hook that runs it.
checklist:
  - id: stdin-json
    text: "hook reads JSON on stdin, either {tool_input: {file_path}} or a flat {file_path}, and compares that file on disk with HEAD."
    source: docs/cli.md#jevlint-hook
  - id: worse-exit-two
    text: "When the edit made the file worse, hook exits 2 with the findings on stderr."
    source: docs/cli.md#jevlint-hook
  - id: silent-pass
    text: "hook exits 0 with no output when nothing got worse, and for no path, a path outside the root, an excluded or unscorable file, no git repository, or more than 32 MiB of input."
    source: docs/cli.md#jevlint-hook
  - id: invalid-json
    text: "Invalid JSON makes hook exit 2 with an error on stderr."
    source: docs/cli.md#jevlint-hook
  - id: staged
    text: "hook --staged reviews the staged change against HEAD, exiting 1 with the report on stdout if anything got worse, and 0 with no output if not."
    source: docs/cli.md#jevlint-hook
  - id: ast-only-default
    text: "hook uses AST metrics only and sends nothing unless --model is passed."
    source: docs/cli.md#jevlint-hook
  - id: head-problems
    text: "A new file counts as all new, and problems already in HEAD are not reported."
    source: docs/cli.md#jevlint-hook
  - id: resolve-links
    text: "hook resolves links in the path it is given, and passes any file outside the root unread."
    source: docs/security.md#untrusted-repositories
  - id: pre-commit-text
    text: "init --pre-commit writes fixed hook text that runs jevlint hook --staged from PATH, with nothing from the repository in it, and writes no config."
    source: docs/security.md#untrusted-repositories
  - id: pre-commit-existing
    text: "init --pre-commit leaves a different existing hook in place unless --force is passed."
    source: docs/cli.md#jevlint-init
  - id: hooks-path
    text: "init --pre-commit refuses a core.hooksPath that leads out of the repository, even through a symlink."
    source: docs/security.md#untrusted-repositories
