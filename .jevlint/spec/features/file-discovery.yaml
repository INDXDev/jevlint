id: file-discovery
title: File discovery
summary: Decides which files an audit reads, in src/files.ts, from include and exclude globs, .gitignore, the source-extension list, the built-in secret and generated exclusions and symlink rules, and warns when the scope is large.
checklist:
  - id: source-extensions
    text: "Only files with an extension in SOURCE_EXTENSIONS are audited, and include or path arguments cannot widen this."
    source: docs/configuration.md#files-that-are-always-excluded
  - id: secret-files
    text: "Files matching .env*, *.pem, *.key, *.p12, *.pfx, id_rsa*, *credentials* or *secret* are never read."
    source: docs/configuration.md#files-that-are-always-excluded
  - id: generated-files
    text: "node_modules, dist, build, vendor, target, coverage and *.min.* are never read."
    source: docs/configuration.md#files-that-are-always-excluded
  - id: fixtures-excluded
    text: ".jevlint/fixtures/ is never audited."
    source: docs/configuration.md#files-that-are-always-excluded
  - id: binary-files
    text: "Binary files are never read."
    source: docs/configuration.md#files-that-are-always-excluded
  - id: exclude-adds
    text: "exclude globs add to .gitignore and the built-in exclusions rather than replacing them."
    source: docs/configuration.md#full-example
  - id: gitignore-from-top
    text: ".gitignore files apply from the top of the git repository down, even when jevlint.toml is in a subdirectory."
    source: docs/security.md#protecting-secrets-in-code
  - id: no-info-exclude
    text: ".git/info/exclude and core.excludesFile are not applied."
    source: docs/security.md#protecting-secrets-in-code
  - id: no-symlink-escape
    text: "Discovery never follows a symlink out of the root, even through include."
    source: docs/security.md#untrusted-repositories
  - id: warn-file-count
    text: "When more than warn_file_count files are in scope, a warning goes to stderr and the run carries on."
    source: docs/troubleshooting.md#a-warning-about-the-home-directory-or-the-number-of-files
  - id: warn-home
    text: "When the root is the home directory and no paths were given, a warning goes to stderr and the run carries on."
    source: docs/troubleshooting.md#a-warning-about-the-home-directory-or-the-number-of-files
