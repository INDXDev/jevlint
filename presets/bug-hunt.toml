# Fallacies of distributed computing: the network is reliable
[[questions]]
id = "unsafe-retry"
type = "score"
title = "Retries cannot repeat a side effect"
instructions = "Does the code retry, or could it receive twice, an operation with a side effect, such as a charge, an email or an insert, without an idempotency key or de-duplication? Also count retry loops with no backoff."
levels = [
  "Yes: specific code here has this defect",
  "Probably: specific code here looks like this defect",
  "Only a doubtful spot, with no line that clearly has this defect",
  "No, or this file has no code where this defect could occur",
]
weight = 2
fix = "Make the operation idempotent with a key, and retry only what is safe, with a limit and backoff."

