  "No, or this file has no code where this defect could occur",
]
weight = 2
fix = "Check the documented behaviour, use the returned value, and pick the call that does what the code means."

# Relationship

# CWE-696
[[questions]]
id = "order-dependence"
type = "score"
title = "Steps cannot run in the wrong order"
instructions = "Does correctness depend on calling things in a particular order that nothing enforces, such as init before use, or a validate step before a save, or does a test or module depend on the state another left behind?"
levels = [
  "Yes: specific code here has this defect",
  "Probably: specific code here looks like this defect",
  "Only a doubtful spot, with no line that clearly has this defect",
  "No, or this file has no code where this defect could occur",
]
weight = 2
fix = "Make the wrong order impossible: have each step return what the next one needs, or merge the steps."

# CWE-372
[[questions]]
id = "impossible-states"
type = "score"
title = "Invalid state combinations cannot be represented"
instructions = "Do several flags or optional fields together describe a state, so that contradictory combinations can exist, such as loading and failed both set, or a status that can jump to a step it should not reach?"
levels = [
  "Yes: specific code here has this defect",
  "Probably: specific code here looks like this defect",
  "Only a doubtful spot, with no line that clearly has this defect",
  "No, or this file has no code where this defect could occur",
]
weight = 2
fix = "Replace the flags with one explicit state type, and allow only the valid transitions."

